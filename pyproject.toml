[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-risk-agent"
version = "0.3.0"
description = "Focused investigation-agent MVP over immutable momentum-risk cases"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic==2.11.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]
